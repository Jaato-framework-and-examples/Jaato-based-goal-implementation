# The goal actor: one agent that pursues a goal across many turns, suspending
# itself whenever it must wait on something outside its control.
#
# Swap the provider here, and the models in `model_tiers` just below it.  See
# .env.example for the matching credential variable.
name: goal-actor
description: >
  Pursues a stated goal, and whenever it must wait on something it does not
  control, ends its turn with a `suspended` completion payload naming when to
  resume and what to re-inspect.  Never sleeps or blocks inside a turn.

provider: openrouter

# No top-level `model:`. With `model_tiers` declared it would be dead config —
# the active model is chosen per turn from `model_tiers[<active_tier>]`, and
# `jaato-scaffold validate` warns that a `model` key here is ignored.
#
# Needs jaato-server >= PR #576, where every producer of "the session's model"
# goes through one `bound_model_for_profile()`. Older servers derive it
# independently in several places, so a tiers-only profile fails differently
# depending on version — and mostly not in a way that names the cause:
# "Missing required environment variables", "envelope.model_name is empty", or
# a SessionInfoEvent validation error that reaches the client only as a dropped
# connection and "spawn refused".
#
# The brownout ladder's rungs. The driver's cascade budget declares a rung that
# REBINDS `planner` to the cheap model once the goal has burned 80 % of any
# budget dimension — so the goal gets cheaper as it runs, instead of dying at
# the ceiling.
#
# The agent never calls `enter_tier` here: it starts in `initial` and stays
# there. Degradation works by changing what that tier POINTS AT, which is why
# no persona change is needed to make the ladder work.
#
# V1 requires every tier to share one provider; both of these ride `openrouter`
# by omitting `provider:`, so they inherit the session's.
model_tiers:
  planner: anthropic/claude-sonnet-4.5
  executor: anthropic/claude-haiku-4.5
  initial: planner
  fallback: executor

plugins:
  # (preload) forces these eager: without it the file_edit and cli tools are
  # discovery-gated, and a small model may never call list_tools to find them.
  - cli(preload)
  - file_edit(preload)
  # `resume_at` is an ABSOLUTE timestamp, and a model does not know what day it
  # is — left to guess, it emits the right month and day with the wrong YEAR,
  # which lands the resume in the past and skips the wait entirely. Preloaded
  # for the same reason as the two above: an eagerly-offered tool gets called,
  # a discovery-gated one may not.
  - environment(preload)
  # Preloaded because the agent otherwise has NO eager way to see what is
  # around it: readFile needs a path you already know, and glob_files is
  # discovery-gated by default, which a small model may never go looking for.
  # An agent that cannot look guesses, and the guess costs a turn. glob_files
  # runs in-process, so it stays available under confinement too — see the
  # swe-bench example, where the shell is scoped to sh/python3/git and `ls`
  # comes back as exit 126.
  - filesystem_query(preload)

plugin_configs:
  openrouter:
    # Referenced FROM the profile via env-var interpolation — the only scheme
    # that works from a public checkout. A `pass://` URI needs the premium
    # resolver, and an unregistered scheme fails silently: jaato warns, then
    # sends the literal URI string as the API key.
    #
    # With the premium resolver installed a `pass://` URI does work here, and
    # is resolved daemon-side. Point it at the SECRET, not its folder:
    # `pass show` on a directory prints a tree listing, which passes through
    # as a short nonsense key and 401s with "Missing Authentication header".
    # >>> LOCAL-ONLY DEVIATION — DO NOT COMMIT <<<
    # Shipped value is "${JAATO_OPENROUTER_API_KEY}"; committed as such.
    # Guarded with: git update-index --skip-worktree <this file>
    api_key: "${JAATO_OPENROUTER_API_KEY}"
  permission:
    policy:
      # This example runs unattended, so there is no human to answer a prompt.
      # A real deployment gates the goal actor like any other agent.
      defaultPolicy: allow

# Context grows monotonically because every resume continues the SAME session.
# `budget` is the strategy that makes policy-aware removal decisions and can
# collect continuously rather than only at a threshold breach.
#
# Correctness does NOT depend on this keeping anything: the driver re-injects
# `watch_handle` and `progress_note` verbatim on every resume, so history GC is
# free to be as aggressive as it likes.  See README §"Why same-session is safe".
gc:
  type: budget
  threshold_percent: 75.0

# Declaring a schema is what exposes `signal_completion` at all.  The two
# branches ARE the pattern: the agent's only exit is to say either "done" or
# "paused, wake me at T".
# JSON Schema constrains field SHAPES, but it cannot say "resume_at is required
# when outcome is suspended" — the descriptions below state that in prose, and
# prose does not validate. This processor enforces the two branches, and checks
# a `finished` claim against the job's own status file and the report on disk
# rather than taking the agent's word for it.
#
# A returned error list BLOCKS the completion and is replayed to the agent, so
# the messages are written as instructions for the retry.
completion_processors:
  - script: scripts/processors/goal_contract.py
    on_error: fail_completion

completion_payload_schema:
  type: object
  additionalProperties: false
  required:
    - outcome
    - progress_note
  properties:
    outcome:
      type: string
      enum: [finished, suspended]
      description: >
        `finished` only when the goal is actually achieved.  `suspended` when
        waiting on something outside your control.
    progress_note:
      type: string
      description: >
        What changed this turn, and what state the next turn inherits.  Written
        for your future self — the driver replays this back to you verbatim on
        resume, so it is the ONLY thing guaranteed to survive.
    result:
      type: object
      description: Final result. Required shape when outcome is `finished`.
      additionalProperties: true
    resume_at:
      type: string
      description: >
        ISO-8601 UTC timestamp for when to resume, e.g. 2026-08-22T14:05:00Z.
        Required when outcome is `suspended`.
    resume_reason:
      type: string
      description: What you are waiting for. Required when outcome is `suspended`.
    watch_handle:
      type: object
      description: >
        How to re-inspect the thing you are waiting on — a path, job id, or URL.
        Required when outcome is `suspended`; replayed back to you on resume.
      additionalProperties: true
    warnings:
      type: array
      items: { type: string }
    errors:
      type: array
      items: { type: string }
