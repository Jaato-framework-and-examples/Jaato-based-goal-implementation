[project]
name = "goal-cascade"
version = "0.1.0"
description = "A jaato cascade that pursues a goal across suspends and resumes"
requires-python = ">=3.10"
dependencies = ["jaato-sdk"]

[project.scripts]
goal-cascade = "goal_cascade.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
